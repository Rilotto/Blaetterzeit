name: CI

# Läuft bei jedem Push auf jeden Branch. Kein pull_request-Trigger, damit die
# Checks nicht doppelt laufen – die Pflicht-Checks eines PRs werden über den
# Head-Commit des Branches erfüllt. Da nur `branches` (ohne `tags`) gesetzt ist,
# lösen Tag-Pushes (v*) diesen Workflow nicht aus; dafür gibt es release.yml.
on:
  push:
    branches: ['**']

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Tags werden für die Ledger-Prüfung gebraucht
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, Lint, Tests, Traceability
        run: npm run verify
      - name: Traceability-Matrix erzeugen
        if: always()
        run: npm run trace:write || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-report
          path: |
            test-results.json
            docs/traceability.md

  android-build:
    name: android-build
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Build-Umgebung ausgeben (Diagnose)
        working-directory: android
        run: |
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          ./gradlew --version --no-daemon
      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      # Download für Gerätetests (z. B. S23 Ultra). Debug-Signatur: vor dem Wechsel auf eine
      # Release-APK muss die App deinstalliert werden (Datenverlust).
      - uses: actions/upload-artifact@v5
        with:
          name: blaetterzeit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
