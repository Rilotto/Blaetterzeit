name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Tag passt zur package.json-Version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag v$TAG ≠ package.json $PKG – erst npm run release:freeze ausführen"; exit 1; }

      - name: Quality Gate (keine APK ohne grüne Regression)
        run: npm run verify

      - name: Keystore bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Secret ANDROID_KEYSTORE_BASE64 fehlt – siehe docs/release-prozess.md"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - run: npm run android:sync

      - name: Signierte Release-APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: GitHub-Release mit APK anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "blaetterzeit-${GITHUB_REF_NAME}.apk"
          # Release-Notes aus dem CHANGELOG-Abschnitt dieser Version
          awk "/^## \\[${VERSION}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "blaetterzeit-${GITHUB_REF_NAME}.apk" \
            --title "Blätterzeit ${GITHUB_REF_NAME}" --notes-file notes.md

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
